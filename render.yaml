# Render blueprint for the EduConnect API.
# Import from the Render dashboard: New → Blueprint → pick this repo.
services:
  - type: web
    name: educonnect-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Frontend and API live on different domains once deployed, so cookies
      # must be SameSite=None + Secure or the browser will not send them.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none

      # Render generates strong random values for these on first deploy.
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d

      # sync:false = Render prompts you for these; they are never stored in git.
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Your Cloudflare Pages URL, e.g. https://educonnect.pages.dev
      # Comma-separate to allow more than one origin.
      - key: CLIENT_URL
        sync: false
